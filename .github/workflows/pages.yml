name: Publish bead calibration app

on:
  push:
    branches: [master]
    paths:
      - 'web/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jcnossen/torch-psf
          ref: 78473cb135e6fd114a7df50adff8b6d891916b12
          path: dependencies/torch-psf
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: dependencies/torch-psf/web
      - run: node web/serve.mjs --build
        env:
          TORCH_PSF_WEB: dependencies/torch-psf/web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
