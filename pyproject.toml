[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "simcode"
version = "2.0.0"
description = "SIMCODE v2: per-window deep-learning localization for DMD-SIMFLUX DNA-PAINT data"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "tifffile", "torch>=2.1"]
# also required, not on PyPI: torch_convspline (~/torch-spline-3d, PSF LUT). Optional: h5py (hdf5 tables).

[project.scripts]
simcode-run = "simcode.run:main"
simcode-strict = "simcode.strict:main"

[tool.setuptools.packages.find]
include = ["simcode*"]

[tool.setuptools.package-data]
simcode = ["netsets.json", "fourpi/datasets.json"]
