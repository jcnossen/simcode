# DMD-SIMFLUX TIRF-SIM (NA 1.49 oil, Zyla 4.2 sCMOS, 642 nm, 108.33 nm px); the paper's low-density movie 1809/cover1/2.
# Reference calibration: models/insitu/calib_1809_2_psf3d.json (+ _avg), camera_maps_1809_2.npz.
name: "1809_2"
movie: /mnt/data/dmdsf/bn_dnapaint/1809/cover1/2/simflux_5.5ms_500mW.tif
out: /mnt/data/dmdsf/simcode2_out/auto/1809_2
beads:                                   # the setup's bead z-stacks (models/insitu/beads = this fit, shipped)
  stacks: [/mnt/data/dmdsf/bn_dnapaint/PSF_calib/raw/zstack2-1.tif, /mnt/data/dmdsf/bn_dnapaint/PSF_calib/raw/zstack3-1.tif,
           /mnt/data/dmdsf/bn_dnapaint/PSF_calib/raw/zstack4-1.tif, /mnt/data/dmdsf/bn_dnapaint/PSF_calib/raw/zstack5-1.tif,
           /mnt/data/dmdsf/bn_dnapaint/PSF_calib/raw/zstack6-1.tif, /mnt/data/dmdsf/bn_dnapaint/PSF_calib/raw/zstack7-1.tif]
  sign: -1
  nball: 32
  holdout: 7
  offset_adu: 106.34
  gain_e_per_adu: 0.56
camera:
  gain_e_per_adu: 0.56                   # SIMCODE paper value (camera_gain.py on 0.5 nM: 0.552); the measured value is reported
  offset_adu: 99.3
  readnoise_from: /home/jc/simcode2/models/insitu/camera_maps_0.5nM.npz   # same sensor (as the reference calibration)
  map_frames: 20000
psf:
  init: [zero, f0.1, f0.2, f0.3, beads]   # multi-start (focus-staggered; focus / z gauge), lowest base-fit NLL wins
process:
  netset: m1809
gpus: [1, 2, 0]
